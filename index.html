<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b1d4e">
<title>El Viaje de las Emociones — Cuento Infantil Interactivo</title>
<style>
  :root{
    --paper:#fffdf7;
    --ink:#2b1d4e;
    --accent:#ff8fab;
    --accent2:#ffd166;
    --turn-time:.75s;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 20% -10%, #5b3fa8 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #ff8fab55 0%, transparent 60%),
      linear-gradient(160deg,#241a45,#160f2e 60%,#1d1440);
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ---------- Cabecera ---------- */
  header{
    text-align:center;
    padding:14px 66px 4px;
    flex:0 0 auto;
  }
  header h1{
    margin:0;
    font-size:clamp(1.05rem,4.6vw,1.6rem);
    letter-spacing:.5px;
    color:#fff;
    text-shadow:0 2px 10px #0006;
  }
  header p{
    margin:4px 0 0;
    font-size:clamp(.7rem,3vw,.85rem);
    color:#e9defbba;
  }

  /* ---------- Libro ---------- */
  .stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 14px 4px;
    perspective:2200px;
    min-height:0;
  }
  .book{
    position:relative;
    width:min(94vw, 560px, calc((100dvh - 205px) / 1.414));
    aspect-ratio:1 / 1.414;
    transform-style:preserve-3d;
    filter:drop-shadow(0 24px 40px #0009);
    touch-action:pan-y;
  }
  /* lomo central */
  .book::before{
    content:"";
    position:absolute;
    left:-6px;top:2%;bottom:2%;
    width:14px;border-radius:8px;
    background:linear-gradient(90deg,#0008,#0000);
    z-index:60;pointer-events:none;
  }
  .page{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transform-origin:left center;
    transition:transform var(--turn-time) cubic-bezier(.45,.05,.2,1);
    will-change:transform;
    border-radius:6px 14px 14px 6px;
    background:var(--paper);
    display:none;
  }
  .page.show{display:block}
  .page.under{z-index:5}
  .page.top{z-index:20}
  .face{
    position:absolute;inset:0;
    border-radius:inherit;
    overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    background:var(--paper);
  }
  .face.front{box-shadow:inset -14px 0 22px -18px #0008, inset 0 0 0 1px #00000012}
  .face.back{
    transform:rotateY(180deg);
    background:
      repeating-linear-gradient(90deg,#0000 0 46px,#00000008 47px 48px),
      linear-gradient(90deg,#efe7d4,#fbf6ea 30%,#f6efe0);
    box-shadow:inset 14px 0 22px -18px #0008;
  }
  .face.back::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg,#00000010,transparent 30%);
  }
  .face img{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    background:var(--paper);
    pointer-events:none;
    -webkit-user-drag:none;
  }

  /* ---------- Zonas táctiles ---------- */
  .taps{position:absolute;inset:0;z-index:50;display:flex}
  .taps button{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;color:#fff;
  }
  .taps .prev{flex:0 0 34%}
  .taps .next{flex:1 1 auto}

  /* ---------- Controles ---------- */
  .hud{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    color:#fff;
  }
  .hud .count{
    font-size:.85rem;
    min-width:56px;text-align:center;
    color:#f3ecffcc;
  }
  .navbtn{
    width:46px;height:46px;border-radius:50%;
    border:0;cursor:pointer;
    background:#ffffff22;
    color:#fff;font-size:1.3rem;
    backdrop-filter:blur(6px);
    transition:.2s;
    display:grid;place-items:center;
  }
  .navbtn:disabled{opacity:.25;cursor:default}
  @media (hover:hover){ .navbtn:not(:disabled):hover{background:#ffffff40;transform:scale(1.06)} }

  .dots{display:flex;gap:7px;align-items:center}
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:#ffffff45;border:0;padding:0;cursor:pointer;transition:.25s;
  }
  .dot.on{background:var(--accent2);transform:scale(1.35)}

  /* ---------- Botón de audio ---------- */
  .audio-btn{
    position:fixed;
    top:calc(10px + env(safe-area-inset-top));
    right:12px;
    z-index:200;
    width:52px;height:52px;border-radius:50%;
    border:0;cursor:pointer;
    background:linear-gradient(145deg,var(--accent),#ff5f8f);
    color:#fff;font-size:1.35rem;
    box-shadow:0 8px 20px #ff5f8f66;
    display:grid;place-items:center;
    animation:pulse 2s infinite;
    transition:transform .15s;
  }
  .audio-btn:active{transform:scale(.92)}
  .audio-btn.playing{animation:none;background:linear-gradient(145deg,#4cc9a0,#2a9d8f);box-shadow:0 8px 20px #2a9d8f66}
  @keyframes pulse{
    0%,100%{box-shadow:0 8px 20px #ff5f8f66,0 0 0 0 #ff8fab88}
    50%{box-shadow:0 8px 20px #ff5f8f66,0 0 0 14px #ff8fab00}
  }
  .audio-label{
    position:fixed;
    top:calc(68px + env(safe-area-inset-top));
    right:12px;z-index:200;
    background:#000000b8;color:#fff;
    font-size:.7rem;padding:5px 9px;border-radius:20px;
    pointer-events:none;transition:opacity .4s;
  }

  .hint{
    text-align:center;
    font-size:.75rem;
    color:#ffffff99;
    padding-bottom:6px;
    animation:blink 2.4s infinite;
  }
  @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

  .hint.off{display:none;animation:none}
  @media (prefers-reduced-motion:reduce){
    .page{transition:none!important}
    .audio-btn,.hint{animation:none!important}
  }
</style>
</head>
<body>

<header>
  <h1>El Viaje de las Emociones</h1>
  <p>Cuento interactivo · Desarrollo socioemocional (0 a 2 años)</p>
</header>

<button class="audio-btn" id="audioBtn" aria-label="Activar o silenciar la música">🔊</button>
<div class="audio-label" id="audioLabel">Toca para escuchar</div>

<div class="stage">
  <div class="book" id="book">
    <!-- las páginas las inyecta JS -->
    <div class="taps">
      <button class="prev" id="tapPrev" aria-label="Página anterior"></button>
      <button class="next" id="tapNext" aria-label="Página siguiente"></button>
    </div>
  </div>
</div>

<div class="hud">
  <button class="navbtn" id="btnPrev" aria-label="Anterior">‹</button>
  <div class="dots" id="dots"></div>
  <span class="count" id="count">1 / 5</span>
  <button class="navbtn" id="btnNext" aria-label="Siguiente">›</button>
</div>
<div class="hint" id="hint">Desliza o toca la página para pasarla</div>

<audio id="bgm" src="assets/audio.mp3" loop preload="auto" playsinline></audio>

<script>
(function(){
  "use strict";
  const TOTAL = 5;
  const book   = document.getElementById("book");
  const dotsEl = document.getElementById("dots");
  const countEl= document.getElementById("count");
  const btnPrev= document.getElementById("btnPrev");
  const btnNext= document.getElementById("btnNext");
  const hint   = document.getElementById("hint");
  const bgm    = document.getElementById("bgm");
  const aBtn   = document.getElementById("audioBtn");
  const aLabel = document.getElementById("audioLabel");

  /* ---------- Crear páginas ---------- */
  const pages = [];
  for (let i = 1; i <= TOTAL; i++){
    const p = document.createElement("div");
    p.className = "page";
    p.innerHTML =
      '<div class="face front"><img src="assets/pages/page-' + String(i).padStart(2,"0") +
      '.jpg" alt="Página ' + i + ' del cuento El Viaje de las Emociones"></div>' +
      '<div class="face back"></div>';
    book.insertBefore(p, book.firstChild);
    pages.push(p);
  }
  // tap zones encima de todo
  book.appendChild(document.querySelector(".taps"));

  pages[0].classList.add("show","top");

  for (let i = 0; i < TOTAL; i++){
    const d = document.createElement("button");
    d.className = "dot" + (i === 0 ? " on" : "");
    d.setAttribute("aria-label","Ir a la página " + (i+1));
    d.addEventListener("click", e => { e.stopPropagation(); goTo(i); });
    dotsEl.appendChild(d);
  }
  const dots = [...dotsEl.children];

  let cur = 0, busy = false;

  function sync(){
    countEl.textContent = (cur+1) + " / " + TOTAL;
    dots.forEach((d,i)=>d.classList.toggle("on", i===cur));
    btnPrev.disabled = cur === 0;
    btnNext.disabled = cur === TOTAL-1;
    hint.classList.toggle("off", cur > 0);
  }

  function turn(next){
    if (busy || next === cur || next < 0 || next >= TOTAL) return;
    busy = true;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const outgoing = pages[cur];
    const incoming = pages[next];
    const forward = next > cur;

    incoming.classList.add("show","under");

    if (reduce){ finish(); return; }

    if (forward){
      // la página actual se voltea hacia la izquierda y descubre la siguiente
      outgoing.classList.remove("under");
      outgoing.classList.add("top");
      void outgoing.offsetWidth;
      outgoing.style.transform = "rotateY(-180deg)";
    } else {
      // la página anterior entra girando desde la izquierda
      incoming.classList.remove("under");
      incoming.classList.add("top");
      incoming.style.transform = "rotateY(-180deg)";
      void incoming.offsetWidth;
      incoming.style.transform = "rotateY(0deg)";
    }

    let done = false;
    const finish = () => {
      if (done) return; done = true;
      outgoing.classList.remove("show","top","under");
      outgoing.style.transform = "";
      incoming.classList.remove("under","top");
      incoming.style.transform = "";
      cur = next;
      busy = false;
      sync();
    };
    const sheet = forward ? outgoing : incoming;
    sheet.addEventListener("transitionend", finish, {once:true});
    setTimeout(finish, 900); // respaldo
  }

  const next = () => turn(cur+1);
  const prev = () => turn(cur-1);
  function goTo(i){ if (i === cur) return; if (Math.abs(i-cur) > 1) { // salto simple
      pages[cur].classList.remove("show","top","under"); pages[cur].style.transform="";
      pages[i].classList.add("show","top"); cur=i; busy=false; sync(); } else turn(i); }

  btnNext.addEventListener("click", next);
  btnPrev.addEventListener("click", prev);
  document.getElementById("tapNext").addEventListener("click", e=>{e.stopPropagation(); next();});
  document.getElementById("tapPrev").addEventListener("click", e=>{e.stopPropagation(); prev();});
  document.addEventListener("keydown", e=>{
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") next();
    if (e.key === "ArrowLeft"  || e.key === "PageUp") prev();
  });

  /* ---------- Swipe ---------- */
  let sx=0, sy=0, moved=false;
  book.addEventListener("touchstart", e=>{
    sx=e.touches[0].clientX; sy=e.touches[0].clientY; moved=false;
    unlockAudio();
  }, {passive:true});
  book.addEventListener("touchmove", e=>{
    const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if (!moved && Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.4){ moved=true; dx<0?next():prev(); }
  }, {passive:true});

  /* ---------- Audio: reproducir al abrir o al primer toque ---------- */
  let unlocked = false;
  function tryPlay(){
    const p = bgm.play();
    if (p && p.catch) p.catch(()=>{ /* bloqueado: esperamos el primer toque */ });
  }
  function unlockAudio(){
    if (unlocked) return;
    unlocked = true;
    if (bgm.paused) tryPlay();
    if (!bgm.paused) hideLabel();
  }
  function hideLabel(){ aLabel.style.opacity = 0; }

  bgm.addEventListener("playing", ()=>{
    aBtn.classList.add("playing"); aBtn.textContent="🎵"; hideLabel();
  });
  bgm.addEventListener("pause", ()=>{
    aBtn.classList.remove("playing"); aBtn.textContent="🔊"; aLabel.textContent="Toca para escuchar"; aLabel.style.opacity=1;
  });
  aBtn.addEventListener("click", e=>{
    e.stopPropagation(); unlocked = true;
    if (bgm.paused) tryPlay(); else bgm.pause();
  });

  // 1) intento inmediato al cargar
  document.addEventListener("DOMContentLoaded", tryPlay);
  bgm.addEventListener("canplay", tryPlay, {once:true});
  tryPlay();
  // 2) primer toque en cualquier parte de la página
  ["pointerdown","touchstart","keydown","click"].forEach(ev =>
    document.addEventListener(ev, unlockAudio, {once:true, passive:true}));
  // al volver a la pestaña
  document.addEventListener("visibilitychange", ()=>{
    if (!document.hidden && unlocked && bgm.paused) tryPlay();
  });

  sync();
})();
</script>
</body>
</html>
